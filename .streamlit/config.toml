# Look and server settings for the website.
[theme]
base = "light"
primaryColor = "#2A78D6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F1"
textColor = "#1A1A19"
baseRadius = "0.6rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F4F4F1"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
